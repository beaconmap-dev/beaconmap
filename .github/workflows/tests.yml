# Runs the test suite on Windows, macOS and Linux for every push and pull request.
# Tests use fake connection data: nothing here downloads the databases or lists.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest (26.04) has no Python 3.9 build, so test 3.9 on 24.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest httpx
      - run: python -m pytest -q
