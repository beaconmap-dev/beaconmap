[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beaconmap"
version = "0.1.0"
description = "See every server your computer talks to, live on a 3D globe. 100% local."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.9"
dependencies = [
  "psutil>=5.9",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "maxminddb>=2.4",
  "certifi>=2023.7",
]
keywords = ["network", "privacy", "security", "visualization", "globe", "netstat"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
]

[project.urls]
Homepage = "https://github.com/beaconmap-dev/beaconmap"
Source = "https://github.com/beaconmap-dev/beaconmap"
Issues = "https://github.com/beaconmap-dev/beaconmap/issues"

[project.scripts]
beaconmap = "beaconmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beaconmap = ["static/*", "static/vendor/*", "extension/*"]
